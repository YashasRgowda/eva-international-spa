<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1411">
  <title>EVA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="lotus" viewBox="0 0 200 140">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M100 18 C116 44 119 80 100 110 C81 80 84 44 100 18 Z"/>
        <path d="M100 110 C121 86 140 62 163 52 C160 81 136 103 100 110 Z"/>
        <path d="M100 110 C79 86 60 62 37 52 C40 81 64 103 100 110 Z"/>
        <path d="M100 110 C136 106 170 92 194 78 C179 101 141 115 100 110 Z"/>
        <path d="M100 110 C64 106 30 92 6 78 C21 101 59 115 100 110 Z"/>
        <path d="M58 124 C84 131 116 131 142 124"/>
      </g>
    </symbol>
  </svg>

  <!-- Shown while we check whether the owner is already logged in -->
  <div class="boot" id="boot">
    <svg class="boot__mark" aria-hidden="true"><use href="#lotus"/></svg>
  </div>

  <!-- ============ LOGIN ============ -->
  <section class="login" id="login" hidden>
    <div class="login__art" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1761470575018-135c213340eb?auto=format&fit=crop&w=1400&q=80" alt="">
      <div class="login__art-text">
        <svg class="login__art-mark"><use href="#lotus"/></svg>
        <p class="login__art-word">EVA</p>
        <p class="login__art-sub">International Spa</p>
      </div>
    </div>

    <div class="login__panel">
      <form class="login__form" id="loginForm" novalidate>
        <svg class="login__mark" aria-hidden="true"><use href="#lotus"/></svg>
        <p class="eyebrow">Admin Panel</p>
        <h1 class="login__title">Welcome back</h1>
        <p class="login__lead">Log in to change your website.</p>

        <label class="field">
          <span class="field__label">Email</span>
          <input type="email" name="email" autocomplete="username" placeholder="your@email.com" required>
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <span class="field__pw">
            <input type="password" name="password" autocomplete="current-password" placeholder="Your password" required>
            <button type="button" class="field__show" id="showPw">Show</button>
          </span>
        </label>

        <p class="form-msg" id="loginMsg" role="alert"></p>

        <button class="btn btn--primary btn--block btn--lg" type="submit" id="loginBtn">Log in</button>
        <button class="link-btn" type="button" id="forgotBtn">Forgot password?</button>
      </form>
    </div>
  </section>

  <!-- ============ ADMIN APP ============ -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side" aria-label="Admin menu">
      <div class="side__brand">
        <svg class="side__mark" aria-hidden="true"><use href="#lotus"/></svg>
        <div>
          <p class="side__word">EVA</p>
          <p class="side__sub">Admin Panel</p>
        </div>
      </div>
      <nav class="side__nav" id="sideNav"></nav>
      <div class="side__foot">
        <a class="side__link" href="../" target="_blank" rel="noopener" id="viewSite"></a>
        <button class="side__link" type="button" id="logoutBtn"></button>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="topbar__menu" type="button" id="menuBtn" aria-label="Open menu">
          <span></span><span></span>
        </button>
        <p class="topbar__title" id="topTitle">Home</p>
        <a class="topbar__site" href="../" target="_blank" rel="noopener">View website</a>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <!-- Save bar for pages with typing -->
  <div class="savebar" id="savebar" aria-live="polite">
    <p class="savebar__msg" id="savebarMsg">You have changes that are not saved yet.</p>
    <button class="btn btn--primary btn--lg" type="button" id="saveBtn">Save changes</button>
  </div>

  <!-- Pop-up used for editing a massage or review, and for "Are you sure?" -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel" id="modalPanel"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="filePicker" accept="image/*" hidden>

  <script type="module" src="admin.js"></script>
</body>
</html>
